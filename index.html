<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New York">
<meta name="theme-color" content="#f6f3ee">
<title>New York</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root {
    --ink: #241c16;
    --muted: #6d6258;
    --paper: #f6f3ee;
    --line: #e4ddd4;
    --card: #fffdf9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body {
    position: relative;
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: none;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    z-index: 20;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  h1 button {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #count {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  #filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0;
    padding: 0 0 2px;
  }
  #filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: 600 14px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c, var(--ink));
  }
  .chip[aria-pressed="true"] {
    background: var(--c, var(--ink));
    border-color: transparent;
    color: var(--on, #fff);
  }
  .chip[aria-pressed="true"] .dot { background: currentColor; }
  #map {
    position: relative;
    z-index: 0;
    flex: 1;
    min-height: 0;
    background: #e6e2da;
  }
  .leaflet-container { font-family: inherit; background: #e6e2da; }
  .raster-streets .leaflet-tile-pane { filter: grayscale(0.85) brightness(1.06) contrast(0.9); }
  .leaflet-top.leaflet-right { top: 10px; }
  .leaflet-control-attribution {
    font-size: 10px;
    max-width: min(70vw, 280px);
    white-space: normal;
    line-height: 1.3;
  }
  .boro-label {
    background: none;
    border: 0;
    font-family: Georgia, Palatino, serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #3f372f;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
    white-space: nowrap;
  }
  .hood-label {
    background: none;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .hood-label span {
    font-family: Georgia, Palatino, serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #2f2821;
    text-shadow: 0 0 2px #fff, 0 0 3px #fff, 0 0 5px #fff;
  }
  .pin-icon { background: none; border: 0; }
  .pin {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--pin);
    color: #fff;
    display: grid;
    place-items: center;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(36, 28, 22, 0.28);
  }
  .pin svg { display: block; }
  .pin.is-on {
    outline: 3px solid var(--pin);
    outline-offset: 1px;
  }
  #tools {
    position: absolute;
    z-index: 500;
    right: 12px;
    top: 108px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    pointer-events: none;
  }
  #tools button, #legend, .sheet-card {
    pointer-events: auto;
  }
  #tools button {
    height: 44px;
    padding: 0 14px;
    border: 0;
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 2px 12px rgba(36, 28, 22, 0.16);
    font: 650 14px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  #tools button[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
  }
  #legend {
    position: absolute;
    z-index: 500;
    left: 12px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: min(280px, calc(100% - 24px));
    max-height: min(46dvh, 420px);
    overflow: auto;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(36, 28, 22, 0.18);
    padding: 14px 14px 12px;
  }
  #legend h2 {
    margin: 0 0 8px;
    font: 650 15px/1.2 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  #legend ul { list-style: none; margin: 0; padding: 0; }
  #legend li {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 28px;
    font-size: 14px;
  }
  .swatch {
    width: 22px;
    height: 6px;
    border-radius: 99px;
    flex: none;
  }
  #legend .fine, .hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }
  #sheet[hidden] { display: none !important; }
  #sheet {
    position: absolute;
    z-index: 800;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    max-width: 100%;
    display: flex;
    justify-content: center;
  }
  .sheet-card {
    width: min(520px, 100%);
    max-width: 100%;
    max-height: min(72dvh, 640px);
    overflow: auto;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(36, 28, 22, 0.18);
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .close-bar {
    display: block;
    width: 100%;
    height: 48px;
    margin-top: 16px;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    font: 650 16px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  .grab {
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: #ddd4c8;
    margin: 4px auto 10px;
  }
  .sheet-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .eyebrow {
    margin: 0 0 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--c);
    color: var(--on, #fff);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  #sheet h2 {
    margin: 0;
    font-family: Georgia, Palatino, serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .area, .note, .addr { margin: 8px 0 0; line-height: 1.4; }
  .area { color: var(--muted); font-size: 14px; }
  .note { font-size: 16px; }
  .addr { color: var(--muted); font-size: 14px; }
  .maps { margin: 12px 0 0; }
  .maps a { font-weight: 650; color: var(--ink); }
  .icon-btn {
    flex: none;
    min-width: 72px;
    height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    font: 650 14px/1 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  .spot-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .spot-list button {
    width: 100%;
    display: grid;
    grid-template-columns: 12px 1fr;
    grid-template-rows: auto auto;
    column-gap: 10px;
    row-gap: 2px;
    text-align: left;
    padding: 12px 0;
    border: 0;
    border-top: 1px solid var(--line);
    background: none;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  .spot-list .mark {
    grid-row: 1 / span 2;
    width: 12px;
    height: 12px;
    margin-top: 4px;
    border-radius: 50%;
    background: var(--c);
  }
  .spot-list .name { font-weight: 650; font-size: 16px; }
  .spot-list .meta { color: var(--muted); font-size: 13px; }
  #toast {
    position: absolute;
    z-index: 700;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(420px, calc(100% - 24px));
    background: var(--ink);
    color: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.35;
  }
  #offline {
    margin: 24px 16px;
    line-height: 1.45;
  }
  @media (min-width: 800px) {
    #legend { bottom: 28px; }
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1><button type="button" id="home" title="Show all of New York">New York</button></h1>
    <p id="count" aria-live="polite"></p>
  </div>
  <div id="filters" role="toolbar" aria-label="Filter by activity"></div>
</header>
<div id="map" role="application" aria-label="Map of New York City"></div>
<div id="tools">
  <button type="button" id="locate">Near me</button>
  <button type="button" id="hoodsBtn" aria-pressed="true">Neighborhoods</button>
  <button type="button" id="linesBtn" aria-pressed="false" aria-expanded="false" aria-controls="legend">Lines</button>
  <button type="button" id="spotsBtn" aria-pressed="false" aria-expanded="false" aria-controls="sheet">Spots</button>
</div>
<aside id="legend" hidden>
  <h2>Subway lines</h2>
  <ul id="legendList"></ul>
  <p class="fine">Colors follow the MTA trunks. Where more than one color shares a track, the lines sit side by side as you zoom in. Staten Island Railway is blue, with the A, C, and E.</p>
</aside>
<section id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </div>
</section>
<div id="toast" hidden></div>

function inkFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? "#241c16" : "#fff";
}
function titleCase(value) {
  return value.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}
function metaFor(type) {
  if (TYPE_META[type]) return TYPE_META[type];
  const known = Object.keys(TYPE_META);
  const extras = [...new Set(PLACES.flatMap(placeTypes))].filter((t) => !TYPE_META[t]);
  const color = EXTRA_COLORS[extras.indexOf(type) % EXTRA_COLORS.length] || "#44403c";
  return { label: titleCase(type), color, ink: inkFor(color) };
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

  const OSM_CREDIT = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  function hasWebGL() {
    try {

    });
  });

  const pins = L.layerGroup().addTo(map);
  let active = "all";
  let selected = null;
  let me = null;
  let toastTimer = 0;
  let swallowMapClick = false;
  function armSwallow() {
    swallowMapClick = true;
    setTimeout(() => { swallowMapClick = false; }, 0);
  }

  function placeTypes(place) {
    return place.types && place.types.length ? place.types : [place.type];
  }
  function displayType(place) {
    const types = placeTypes(place);
    if (active !== "all" && types.includes(active)) return active;
    return place.type;
  }
  const hashType = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hashType && PLACES.some((place) => placeTypes(place).includes(hashType))) active = hashType;

  function typesInUse() {
    const preferred = ["breakfast", "coffee", "restaurant", "michelin", "bar", "outdoors", "rooftop-garden", "gardens", "parks", "museum", "books", "show"];
    const present = [...new Set(PLACES.flatMap(placeTypes))];
    return preferred.filter((type) => present.includes(type))
      .concat(present.filter((type) => !preferred.includes(type)).sort());
  }
  function matches(place) {
    return active === "all" || placeTypes(place).includes(active);
  }
  function visiblePlaces() {
    return PLACES.filter(matches);
  }
  function pinIcon(place, on) {
    const type = displayType(place);
    const meta = metaFor(type);
    const icon = ICONS[type] || ICONS.museum;
    return L.divIcon({
      className: "pin-icon",
      html: `<div class="pin${on ? " is-on" : ""}" style="--pin:${meta.color}">${icon}</div>`,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });
  }
  function renderPins() {
    pins.clearLayers();
    visiblePlaces().forEach((place, index) => {
      const id = PLACES.indexOf(place);
      const marker = L.marker([place.lat, place.lng], {
        pane: "pins",
        icon: pinIcon(place, selected === id),
        keyboard: true,
        title: place.name,
        zIndexOffset: selected === id ? 1000 : index
      });
      marker.on("click", (event) => {
        L.DomEvent.stopPropagation(event);
        armSwallow();
        openPlace(id, false);
      });
      marker.addTo(pins);
    });
    const shown = visiblePlaces().length;
    const label = active === "all" ? "spots" : metaFor(active).label.toLowerCase();
    countEl.textContent = shown + " " + label;
  }
  function renderFilters() {
    const types = typesInUse();
    const items = [{ id: "all", label: "All", color: "#241c16", ink: "#fff" }]
      .concat(types.map((type) => ({ id: type, ...metaFor(type) })));
    filtersEl.innerHTML = items.map((item) => {
      const pressed = active === item.id;
      const dot = item.id === "all" ? "" : `<span class="dot" style="--c:${item.color}"></span>`;
      return `<button type="button" class="chip" data-type="${escapeHtml(item.id)}" aria-pressed="${pressed}" style="--c:${item.color};--on:${item.ink}">${dot}${escapeHtml(item.label)}</button>`;
    }).join("");
    filtersEl.querySelectorAll(".chip").forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.type));
    });
  }
  function setFilter(type) {
    active = type;
    if (selected != null && !matches(PLACES[selected])) selected = null;
    const nextHash = type === "all" ? location.pathname + location.search : "#" + encodeURIComponent(type);
    try { history.replaceState(null, "", nextHash); } catch (error) { /* file:// may block history */ }
    renderFilters();
    renderPins();
    if (!sheetEl.hidden && sheetEl.dataset.mode === "list") openList();
    else if (!sheetEl.hidden && sheetEl.dataset.mode === "place" && selected == null) closeSheet();
  }
  function closeLegend() {
    legendEl.hidden = true;
    linesBtn.setAttribute("aria-pressed", "false");
    linesBtn.setAttribute("aria-expanded", "false");
  }
  function toggleLegend() {
    const open = legendEl.hidden;
    if (open) {
      closeSheet();
      legendEl.hidden = false;
      linesBtn.setAttribute("aria-pressed", "true");
      linesBtn.setAttribute("aria-expanded", "true");
    } else closeLegend();
  }
  function closeSheet() {
    sheetEl.hidden = true;
    sheetEl.dataset.mode = "";
    spotsBtn.setAttribute("aria-pressed", "false");
    spotsBtn.setAttribute("aria-expanded", "false");
    if (selected != null) {
      selected = null;
      renderPins();
    }
  }
  function showSheet(mode, html) {
    closeLegend();
    sheetEl.hidden = false;
    sheetEl.dataset.mode = mode;
    sheetBody.innerHTML = html;
    const listMode = mode === "list";
    spotsBtn.setAttribute("aria-pressed", listMode ? "true" : "false");
    spotsBtn.setAttribute("aria-expanded", listMode ? "true" : "false");
  }
  function placeHtml(place) {
    const meta = metaFor(displayType(place));
    const maps = place.maps
      ? `<p class="maps"><a href="${escapeHtml(place.maps)}" target="_blank" rel="noopener">Google Maps</a></p>`
      : "";
    return `
      <div class="sheet-top">
        <div>
          <p class="eyebrow"><span class="pill" style="--c:${meta.color};--on:${meta.ink}">${escapeHtml(meta.label)}</span></p>
          <h2 id="sheetTitle">${escapeHtml(place.name)}</h2>
        </div>
      </div>
      <p class="area">${escapeHtml(place.area)}</p>
      <p class="note">${escapeHtml(place.note)}</p>
      <p class="addr">${escapeHtml(place.address)}</p>
      ${maps}
      <button type="button" class="close-bar" data-close>Close</button>`;
  }
  function openPlace(id, fly) {
    const place = PLACES[id];
    if (!place) return;
    if (active !== "all" && !placeTypes(place).includes(active)) setFilter(place.type);
    selected = id;
    renderPins();
    showSheet("place", placeHtml(place));
    const zoom = Math.max(map.getZoom(), 15);
    const point = map.project([place.lat, place.lng], zoom);
    point.y += (sheetEl.offsetHeight || 220) / 2;
    const target = map.unproject(point, zoom);
    if (fly) map.flyTo(target, zoom, { duration: 0.5 });
    else map.setView(target, Math.max(map.getZoom(), 14), { animate: true });
  }
  function openSubway(route, color) {
    selected = null;
    renderPins();
    const ink = inkFor(color);
    const pills = route.split(" ").filter(Boolean).map((token) =>
      `<span class="pill" style="--c:${color};--on:${ink}">${escapeHtml(token)}</span>`
    ).join("");
    showSheet("subway", `
      <div class="sheet-top">
        <div>
          <p class="eyebrow">${pills}</p>
          <h2 id="sheetTitle">Subway</h2>
        </div>
      </div>
      <p class="note">These trains use this stretch of track.</p>
      <button type="button" class="close-bar" data-close>Close</button>`);
  }
  function openList() {
    const rows = visiblePlaces();
    const heading = active === "all" ? "All spots" : metaFor(active).label;
    const items = rows.map((place) => {
      const id = PLACES.indexOf(place);
      const meta = metaFor(displayType(place));
      return `<li><button type="button" data-open="${id}">
        <span class="mark" style="--c:${meta.color}"></span>
        <span class="name">${escapeHtml(place.name)}</span>
        <span class="meta">${escapeHtml(meta.label)} · ${escapeHtml(place.area)}</span>
      </button></li>`;
    }).join("");
    showSheet("list", `
      <div class="sheet-top">
        <div>
          <h2 id="sheetTitle">${escapeHtml(heading)}</h2>
          <p class="hint">Tap a name to open it on the map.</p>
        </div>
      </div>
      <ul class="spot-list">${items || "<li><p class=\"hint\">Nothing in this filter.</p></li>"}</ul>
      <button type="button" class="close-bar" data-close>Close</button>`);
  }
  function toggleList() {
    if (!sheetEl.hidden && sheetEl.dataset.mode === "list") closeSheet();
    else openList();
  }
  function showToast(message) {
    toastEl.hidden = false;
    toastEl.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3200);
  }
  function fitCity() {
    map.fitBounds(boroughLayer.getBounds(), { padding: [18, 18] });
  }

  document.getElementById("legendList").innerHTML = LINE_LEGEND.map(([color, label]) =>
    `<li><span class="swatch" style="background:${color}"></span>${escapeHtml(label)}</li>`
  ).join("");

  linesBtn.addEventListener("click", toggleLegend);
  hoodsBtn.addEventListener("click", toggleHoods);
  spotsBtn.addEventListener("click", toggleList);
  document.getElementById("home").addEventListener("click", () => {
    closeSheet();
    closeLegend();
    fitCity();
  });
  document.getElementById("locate").addEventListener("click", () => {
    map.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true });
  });
  map.on("locationfound", (event) => {
    if (!me) {
      me = L.circleMarker(event.latlng, {
        pane: "pins",
        radius: 8,
        color: "#fff",
        weight: 3,
        fillColor: "#2563eb",
        fillOpacity: 1
      }).addTo(map);
    } else me.setLatLng(event.latlng);
  });
  map.on("locationerror", () => {
    showToast("This browser did not share a location. You can still pan the map.");
  });
  map.on("click", () => {
    if (swallowMapClick) return;
    if (!sheetEl.hidden) closeSheet();
  });
  sheetEl.addEventListener("click", (event) => {
    if (event.target.closest("[data-close]")) {
      closeSheet();
      return;
    }
    const opener = event.target.closest("[data-open]");
    if (opener) openPlace(Number(opener.dataset.open), true);
  });
  function placeChrome() {
    document.getElementById("tools").style.top =
      (document.querySelector("header").offsetHeight + 10) + "px";
  }
  window.addEventListener("resize", placeChrome);
  window.addEventListener("load", placeChrome);
  if (window.ResizeObserver) new ResizeObserver(placeChrome).observe(document.querySelector("header"));
  placeChrome();
  map.on("zoomend", syncNames);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeSheet();
      closeLegend();
    }
  });

  renderFilters();
  renderPins();
  fitCity();
  syncNames();
}
</script>
</body>
</html>
